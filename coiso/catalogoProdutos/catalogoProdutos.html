<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pudding</title>
    <style>
        .body {
            background-color: rgb(9, 92, 115);
        }
        .catalogo {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
            overflow-x: auto;
            background-color: rgb(9, 92, 115);
            border-radius: 20px;
            justify-content: center;
            align-items: space-around;
        }

        .catalogo-item {
            flex: 0 0 280px;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background-color:darkslategrey ;
            color: white;
        }

        .catalogo-item img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }
        .botao {
            color: white;
            background-color: blueviolet;
            border: 1px solid #4000fe;
            border-radius: 20px;
        }
        .search {
            color: rgb(23, 93, 113);
            background-color: rgb(255, 255, 255);
            border: 1px solid #4a00f7;
            border-radius: 20px;
        }
    </style>
</head>
<body class="body">
    <form>
        <input type="text" placeholder="Pesquisar produtos..." id="searchInput" class="search">
        <button type="button" id="searchButton" class="botao">Pesquisar</button>
        <select id="brandFilter" class="botao">
            <option value="">Todas as marcas</option>
            <option value="Asus">Asus</option>
            <option value="Samsung">Samsung</option>
            <option value="Apple">Apple</option>
            <option value="Dell">Dell</option>
            <option value="Lenovo">Lenovo</option>
            <option value="SteamDeck">SteamDeck</option>
        </select>
        <select id="priceFilter" class="botao">
            <option value="">Todos os preços</option>
            <option value="10000">Até R$ 10.000</option>
            <option value="15000">Até R$ 15.000</option>
            <option value="20000">Até R$ 20.000</option>
            <option value="20001">Acima de R$ 20.000</option>
        </select>
        <button type="button" id="resetButton" class="botao">Resetar</button>
        <br><br>
        
        <div class="catalogo" id="catalogos" class="botao">
        </div>
    </form>

            ['REDMAGIC 10 Air', 5599, '120Hz', '5G', 'Android', '16GB RAM+512GB ROM', 'Snapdragon 8 Gen 3', '6.8 AMOLED Tela cheia', 'FHD+', '50MP Câmera', 'Dual-Sim', 'Preto', 'fotos/REDMAGIC-10Air.png'],
            [ 'HUAWEI Mate XT ULTIMATE DESIGN', 19996.60, 'Celular 16GB+1TB', 'Design Fino com Três Dobras', 'Tela HUAWEI X-True de Alta Resolução de 10,2 polegadas', 'Câmera XMAGE de Ultra Abertura', 'Vermelho', 'fotos/HUAWEI-Mate-XTULTIMATE.png']
            
        ];
        const divCatalogo = document.getElementById('catalogos');
            const searchInput = document.getElementById('searchInput');
        const brandFilter = document.getElementById('brandFilter');
        const priceFilter = document.getElementById('priceFilter');

        function renderCatalogo() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const selectedBrand = brandFilter.value.toLowerCase();
            const selectedPrice = priceFilter.value;

            const produtosFiltrados = catalogo.filter(item => {
                const textoProduto = item.slice(0, -1).join(' ').toLowerCase();
                const nomeProduto = item[0].toLowerCase();
                const preco = item[1];
                const correspondeBusca = textoProduto.includes(searchTerm);
                const correspondeMarca = !selectedBrand || nomeProduto.startsWith(selectedBrand);
                const correspondePreco = !selectedPrice
                    || (selectedPrice === '20001' && preco > 20000)
                    || (selectedPrice !== '20001' && preco <= Number(selectedPrice));

                return correspondeBusca && correspondeMarca && correspondePreco;
            });

            divCatalogo.innerHTML = produtosFiltrados.length
                ? produtosFiltrados.map(item => `
                    <div class="catalogo-item">
                        <img src="${item[item.length - 1]}" alt="${item[0]}">
                        <h3>${item[0]}</h3>
                        <ul>
                            ${item.slice(1, -1).map(detail => `<li>${detail}</li>`).join('')}
                        </ul>
                    </div>
                `).join('')
                : '<p>Nenhum produto encontrado.</p>';
        }

        document.getElementById('searchButton').addEventListener('click', renderCatalogo);
        searchInput.addEventListener('input', renderCatalogo);
        brandFilter.addEventListener('change', renderCatalogo);
        priceFilter.addEventListener('change', renderCatalogo);
        document.getElementById('resetButton').addEventListener('click', () => {
            searchInput.value = '';
            brandFilter.value = '';
            priceFilter.value = '';
            renderCatalogo();
        });

        renderCatalogo();
